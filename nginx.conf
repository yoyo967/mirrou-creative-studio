server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Komprimierung (level 9 for max compression on static SSG)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 9;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # Redirect trailing slashes to non-trailing slashes (except for root /)
    rewrite ^/(.+)/$ /$1 permanent;

    # Routing-Logik: Wichtig für SSG
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Immutable hashed assets (JS, CSS, fonts, images in /assets/)
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static images and media
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # HTML pages — short cache for fresh SSG content
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    error_page 404 /404.html;
}
