name: Claude · @claude (Vertex AI)

# Claude Code als Teammitglied im Repo: schreib "@claude ..." in ein Issue oder einen
# PR-/Review-Kommentar -> Claude analysiert, antwortet, implementiert, erstellt PRs.
# Auth via Google Vertex AI + Workload Identity Federation (KEYLESS, laeuft auf eurem GCP).
#
# STATUS: laeuft NUR bei "@claude"-Mention (bewusste Aktion), nie bei Push. Dormant bis
# das einmalige Vertex/WIF-Setup erfolgt ist -> docs/CLAUDE_VERTEX_SETUP.md.
# Reuse: nutzt dieselben Secrets WIF_PROVIDER + GCP_SA_EMAIL wie deploy.yml (ein SA,
# eine WIF — Service-Account braucht zusaetzlich die Rolle roles/aiplatform.user).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # OIDC fuer WIF

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC / WIF — keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Claude Code (via Vertex AI)
        uses: anthropics/claude-code-action@v1
        with:
          use_vertex: "true"
          trigger_phrase: "@claude"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Modell + Region als Repo-Variablen ueberschreibbar (Defaults = verifiziert lauffaehig).
          # Fuer EU-Datenresidenz VERTEX_REGION auf eine EU-Vertex-Region setzen, in der das
          # gewaehlte Claude-Modell verfuegbar ist (z. B. europe-west1) — siehe Setup-Doku.
          claude_args: >-
            --model ${{ vars.CLAUDE_VERTEX_MODEL || 'claude-sonnet-4-5@20250929' }}
            --max-turns 12
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          CLOUD_ML_REGION: ${{ vars.VERTEX_REGION || 'us-east5' }}
          VERTEX_REGION_CLAUDE_4_5_SONNET: ${{ vars.VERTEX_REGION || 'us-east5' }}
