name: Deploy · Cloud Run (OIDC)

# Ersetzt deploy_gcp.ps1 — Deploy als GitHub Action via Workload Identity Federation
# (OIDC, KEIN statischer Service-Account-Key im Repo).
#
# STATUS: dormant bis die GCP-WIF einmalig eingerichtet ist → siehe
#         docs/DEPLOY_OIDC_SETUP.md. Bis dahin laeuft NUR der manuelle Trigger
#         (workflow_dispatch); Auto-Deploy bei Push ist bewusst auskommentiert.

on:
  workflow_dispatch: {}
  # Nach erfolgreicher OIDC-Einrichtung optional aktivieren:
  # push:
  #   branches: [main]
  #   paths: ['src/**', 'public/**', 'index.html', 'nginx.conf', 'Dockerfile', 'package*.json']

permissions:
  contents: read
  id-token: write   # erforderlich fuer OIDC-Token

env:
  PROJECT_ID: studio-4188712377-b3681
  REGION: europe-west3
  SERVICE: mirrou-creative-studio

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    name: build · deploy · verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC / Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image (Cloud Build)
        run: gcloud builds submit --tag "gcr.io/${PROJECT_ID}/${SERVICE}" --project "${PROJECT_ID}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "gcr.io/${PROJECT_ID}/${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi

      - name: Service-URL + Live-Check
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')
          echo "Live: $URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/de")
          echo "GET /de → $code"
          test "$code" = "200"
